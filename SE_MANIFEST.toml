# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-mapspec-schema"
schema_version = "0.5.0"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-mapspec-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
# WHY: Repo identity is defined structurally
class = "mapping"
summary = "Mapping vocabulary and structural correspondence rules for the SE ecosystem."

# === Dependency Declarations ===

[depends]
required = [
    { repository = "se-constitution", kind = "semantic", version = "main" },
    { repository =  "se-kernel", kind = "semantic", version = "main" },
]
optional = []

# === Provided Artifacts ===

[provides]
# WHY: Explicit artifact ownership (core to this repository)
artifacts = ["mapping-primitives", "mapping-structure", "mapping-constraints"]

# === Scope ===

[scope]
# WHY: Keep this tight and structural
includes = [
    "definition of mapping vocabulary",
    "definition of structural correspondence",
    "constraints on mapping expressions",
]

excludes = [
    "runtime transformations",
    "adapters or connectors",
    "domain semantics",
]

[validation]
entrypoint = "none"

# === Behavior / governance ===

[naming]
# WHY: Declares expected repo-family naming convention
pattern = "se-*"

[governance]
# WHY: Declares governing authority for this repository
authority = "structural-explainability"

# === External references ===

[citation]
cff = "CITATION.cff"

[traceability]
# WHY: Reserved for future identifier resolution
identifier_map = "none"
